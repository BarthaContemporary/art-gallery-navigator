# Ensure Docker starts only AFTER the gocryptfs encrypted mount is up, so the
# jvb-webdav container never binds the empty plaintext directory underneath
# /opt/jvb/webdav-plain (which would write user files UNENCRYPTED to the NVMe
# and then have them shadowed when gocryptfs mounts over the path).
#
# Install on the VPS:
#   install -D infra/compose/systemd/docker.service.d/10-webdav-crypt.conf \
#     /etc/systemd/system/docker.service.d/10-webdav-crypt.conf
#   systemctl daemon-reload
[Unit]
After=webdav-crypt.service
Requires=webdav-crypt.service
