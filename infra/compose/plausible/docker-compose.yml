# ===========================================================================
# Plausible Analytics — Community Edition (self-hosted, cookieless analytics)
#
# Mirrors the official reference stack at
#   https://github.com/plausible/community-edition  (tag v3.0.1)
# with three deviations for our VPS:
#   1. restart: unless-stopped (not "always").
#   2. Only the plausible app is published, on 127.0.0.1:8018 — host Caddy
#      terminates TLS for analytics.<domain> and reverse-proxies to it.
#      (8018, not 8000: Supabase's Kong already owns 127.0.0.1:8000 on this VPS.)
#      Postgres (5432) and ClickHouse (8123/9000) stay internal to the
#      compose network; they are NEVER exposed publicly.
#   3. env_file: .env feeds the app (copy .env.example -> .env first).
#
# Bring up:   cd infra/compose/plausible && docker compose up -d
# See README.md in this directory for the full runbook.
# ===========================================================================

services:
  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      # Must match the password embedded in DATABASE_URL in your .env.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      # Quieten ClickHouse's very chatty system logs.
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      # Bind IPv4 only — Docker bridge networks don't enable IPv6 by default,
      # which otherwise spams "Address family for hostname not supported".
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      # Trim resource use for a small single-VPS setup (<16 GB RAM).
      # https://clickhouse.com/docs/en/operations/tips#using-less-than-16gb-of-ram
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  plausible:
    image: ghcr.io/plausible/community-edition:v3.0.1
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    # All configuration is read from ./.env (copy from .env.example).
    env_file:
      - .env
    ports:
      # Loopback only — host Caddy proxies analytics.<domain> here.
      # HTTP_PORT defaults to 8000 inside the container. Publish on host 8018
      # to avoid clashing with Supabase's Kong (127.0.0.1:8000) on this VPS.
      - "127.0.0.1:8018:8000"
    volumes:
      - plausible-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      # required: https://github.com/plausible/community-edition/wiki/configuration#required
      - BASE_URL=${BASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # registration: https://github.com/plausible/community-edition/wiki/configuration#registration
      - TOTP_VAULT_KEY
      - DISABLE_REGISTRATION
      - ENABLE_EMAIL_VERIFICATION
      # web: https://github.com/plausible/community-edition/wiki/configuration#web
      - HTTP_PORT
      - HTTPS_PORT
      # databases: https://github.com/plausible/community-edition/wiki/configuration#database
      - DATABASE_URL
      - CLICKHOUSE_DATABASE_URL
      # email (Resend over SMTP): https://github.com/plausible/community-edition/wiki/configuration#email
      - MAILER_ADAPTER
      - MAILER_EMAIL
      - MAILER_NAME
      - SMTP_HOST_ADDR
      - SMTP_HOST_PORT
      - SMTP_USER_NAME
      - SMTP_USER_PWD
      - SMTP_HOST_SSL_ENABLED

volumes:
  db-data:
  event-data:
  event-logs:
  plausible-data:
