# Kong declarative config (DB-less), trimmed from upstream supabase/docker.
# $SUPABASE_ANON_KEY / $SUPABASE_SERVICE_KEY are substituted by the container
# entrypoint (see docker-compose.yml) from ANON_KEY / SERVICE_ROLE_KEY.
#
# Removed vs upstream: realtime, functions and analytics routes (services not
# deployed) and the dashboard route (Studio is proxied directly by Caddy on
# the host, behind basic-auth).

_format_version: '2.1'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  ## Open auth routes: email verification links etc. arrive without an apikey.
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  ## Secure auth routes
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## PostgREST
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Storage (incl. TUS resumable upload + /render/image via imgproxy).
  ## No key-auth here (upstream pattern) — storage-api validates JWTs itself,
  ## which is what signed upload/download URLs rely on.
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  ## postgres-meta is deliberately NOT routed through the public gateway.
  ## It executes arbitrary SQL as supabase_admin (bypasses RLS), so exposing
  ## it to the internet — even behind the service_role key — makes a single
  ## key leak a full remote database takeover. The Supabase Studio container
  ## reaches postgres-meta directly over the internal Docker network
  ## (STUDIO_PG_META_URL=http://meta:8080), so no public route is needed.
  ## To run ad-hoc SQL/migrations, tunnel to Postgres over SSH (it is bound to
  ## the host's 127.0.0.1:5432, never public) and use psql / the Supabase CLI:
  ##   ssh -L 5432:127.0.0.1:5432 <vps>   # then psql postgresql://…@127.0.0.1:5432/postgres
