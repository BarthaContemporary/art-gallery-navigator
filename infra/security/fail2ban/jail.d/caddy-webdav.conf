# fail2ban jail for the WebDAV shared drive. Bans an IP after repeated auth
# failures against the drive host. Install to
# /etc/fail2ban/jail.d/caddy-webdav.conf, then `systemctl restart fail2ban`.
#
# Mind the shared-office-IP trap. Every HTTP Basic connection BEGINS with an
# unauthenticated request that draws a 401 challenge before the client sends
# credentials, and the filter counts every 401 — so the counter fills with
# innocent challenges from every Mac in the gallery, which all share one
# public IP. A banned IP loses port 443 for the WHOLE server: the drive AND
# the Supabase API, so uploads and thumbnails die in the studio while pages
# (served by Vercel) keep working — which is exactly how the August 2026
# outage looked. A Mac auto-reconnecting with a stale Keychain password
# re-fills the counter every few minutes and keeps the ban warm indefinitely.
#
# maxretry therefore tolerates an office of auto-mounting Macs while still
# stopping a brute force (15 guesses per 10 min against bcrypt passwords is
# nothing). Put the gallery's static IP in ignoreip so office traffic never
# counts at all.
[caddy-webdav]
enabled  = true
port     = https
filter   = caddy-webdav
# Ubuntu's fail2ban defaults to the systemd-journal backend, which silently
# IGNORES logpath — the jail sat at "Total failed: 0" forever while 401s
# scrolled past in the file. Force file polling so the log is actually read.
backend  = auto
logpath  = /var/log/caddy/files-access.log
maxretry = 15
findtime = 10m
bantime  = 1h
# Gallery office IP(s), space-separated — never banned, challenges not counted.
# ignoreip = 203.0.113.7
