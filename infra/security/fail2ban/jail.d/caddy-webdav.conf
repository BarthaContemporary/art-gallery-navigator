# RETIRED — deliberately disabled, August 2026. Do not re-enable casually.
#
# This jail banned IPs off port 443 of the whole server — drive AND Supabase
# API together — and its signal was unfixably noisy: every legitimate
# Basic-auth mount begins with 401 challenges, macOS produces them in bursts
# all day, and a remote user on a rotating consumer ISP was locked out of the
# drive and the studio's uploads on every fresh address for a week. Two rounds
# of filter surgery (credentialed-401s only, office ignoreip) still left
# legitimate-user ban paths open (a stale Keychain entry, a shared IP).
#
# What it protected against — online password guessing — is already dead on
# arrival: per-user bcrypt hashes of strong generated passwords, over TLS.
# A guesser gets nothing from unlimited attempts; a jail adds risk (locking
# out the gallery) without adding safety. Forensics on demand instead:
#   grep '"Authorization"' /var/log/caddy/files-access.log | grep '"status":401'
# shows every real failed login with its source IP.
#
# If a future threat model genuinely needs automated banning, scope the action
# to the drive only (never the API port), whitelist all known user networks,
# and alert instead of ban first.
[caddy-webdav]
enabled  = false
