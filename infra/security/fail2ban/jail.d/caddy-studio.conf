# fail2ban jail for the Supabase Studio break-glass dashboard (studio.<domain>).
# This is the most sensitive endpoint on the box (arbitrary SQL), so ban harder
# and longer than the file drive. Reuses the caddy-webdav filter (same JSON 401
# shape). Install to /etc/fail2ban/jail.d/caddy-studio.conf, then
# `systemctl restart fail2ban`. Requires the `log` directive on the studio
# Caddy block writing /var/log/caddy/studio-access.log.
[caddy-studio]
enabled  = true
port     = https
filter   = caddy-webdav
logpath  = /var/log/caddy/studio-access.log
maxretry = 4
findtime = 10m
bantime  = 6h
