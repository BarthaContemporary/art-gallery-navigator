# fail2ban filter for the WebDAV endpoint — matches WRONG-CREDENTIAL 401s in
# Caddy's JSON access log for the drive host. Install to
# /etc/fail2ban/filter.d/caddy-webdav.conf  (see infra/README.md §6d).
#
# Every legitimate Basic-auth connection BEGINS with a credential-less request
# that draws a 401 challenge, and auto-mounting Macs produce those in bursts
# all day — counting bare 401s therefore bans legitimate users (a home user on
# a rotating ISP address was locked out of the drive AND the API on a fresh IP
# every hour). Caddy (≥2.5) logs an "Authorization":["REDACTED"] header on any
# request that actually carried credentials — never the value — and challenge
# requests have no such header, so requiring it means only real failed logins
# count. Do NOT "fix" this with Caddy's log_credentials option: that logs the
# raw header, passwords included.
[Definition]
failregex = "remote_ip":"<HOST>",.*"Authorization":.*"status":401
ignoreregex =
# Caddy logs `ts` as a Unix epoch float; without this, fail2ban can't parse
# event time and falls back to read-time, misfiring findtime windows on log
# rotation/replay.
datepattern = "ts":{EPOCH}
