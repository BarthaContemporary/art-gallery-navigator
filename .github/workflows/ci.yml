name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: the action reads it from package.json's
      # packageManager, and naming both fails the job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Form-key guard: fails when a field name, type, hidden input or request
      # body key in the studio changes without scripts/ui-guard's baseline
      # being updated in the same change (autosave contract in CLAUDE.md).
      # Runs before the build because it needs only the TypeScript parser.
      - name: UI guard (studio form keys)
        run: pnpm ui:guard
      # Builds and typechecks every workspace, the studio and the website included.
      - run: pnpm turbo build typecheck
