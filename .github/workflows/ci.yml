name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: the action reads it from package.json's
      # packageManager, and naming both fails the job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # node:test over the *.test.ts files (Node 22 strips the types): the
      # security-rule helpers, and the checks that keep the files the studio,
      # capture and image worker hold in copies identical. Needs no build.
      - name: Unit tests
        run: pnpm test:unit
      # Form-key guard: fails when a field name, type, hidden input or request
      # body key in the studio changes without scripts/ui-guard's baseline
      # being updated in the same change (autosave contract in CLAUDE.md).
      # Runs before the build because it needs only the TypeScript parser.
      - name: UI guard (studio form keys)
        run: pnpm ui:guard
      # Builds and typechecks every workspace, the studio and the website included.
      - run: pnpm turbo build typecheck
  # Fails on any published advisory for a package in the lockfile, so a new
  # one shows up on the next push. Fixes and the forced versions in
  # package.json's pnpm.overrides: docs/ops/dependency-overrides.md.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: the action reads it from package.json's
      # packageManager, and naming both fails the job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm audit
  # The image worker's container installs from its own lockfile
  # (infra/image-worker/pnpm-lock.yaml, frozen), outside the workspace, so
  # the root lockfile and audit above do not cover what the server runs.
  # Check that lockfile matches package.json, typecheck against exactly those
  # versions, and audit them. After changing the worker's package.json:
  # `pnpm install --ignore-workspace --lockfile-only` in infra/image-worker.
  worker-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/image-worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm audit --ignore-workspace
