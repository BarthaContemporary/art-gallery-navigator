# Supabase CLI configuration for local development.
# The self-hosted VPS stack (infra/compose) is configured separately via .env;
# this file only drives `supabase start` / `supabase db reset` locally.

project_id = "jvb-project"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Invite-only system: public signup is disabled, users are created via
# admin invitations (see public.invitations + GoTrue invite flow).
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "500MiB"

[inbucket]
enabled = true
port = 54324

[analytics]
enabled = false
